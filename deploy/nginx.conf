# md-notes 的 nginx 站点配置
#
# 安装：
#   sudo cp deploy/nginx.conf /etc/nginx/conf.d/md-notes.conf
#   sudo sed -i 's/notes.example.com/你的真实域名/g' /etc/nginx/conf.d/md-notes.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# 前提：
#   1) 应用监听 127.0.0.1:3001（裸机：.env 里 HOST=127.0.0.1；Docker：把容器 3001 映射到宿主机 127.0.0.1）。
#   2) 证书先用 certbot 申请，路径见 ssl_certificate 两行；内网可换自签证书，命令见 TLS 段落注释。
#
# 这个文件只有两个 server 块（443 主站 + 80 跳转），不含 http{} / events{}，
# 那是 /etc/nginx/nginx.conf 的职责。放 /etc/nginx/conf.d/ 或 sites-available/ 由 http{} include 进来即可。
#
# 两个容易踩的坑，本文件已按此书写：
#   坑一：add_header 不会叠加继承。某个 location 里只要写了一行 add_header，
#         server 级别的所有 add_header 在这个 location 里就全部失效。
#         所以下面需要加头的 location 都写全，不需要加的一行都不写。
#   坑二：应用层 helmet 已经在发 X-Content-Type-Options / Referrer-Policy / X-Frame-Options。
#         如果 nginx 再加一遍，同一个头会出现两次。对 X-Frame-Options 来说，
#         部分浏览器遇到重复值会直接忽略该头（等于失去防点击劫持保护）。
#         所以这里用 proxy_hide_header 把上游那三个头摘掉，再由 nginx 统一发一份。

# ---------------------------------------------------------------------------
# 80 端口：只做跳转，以及 certbot webroot 校验
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name notes.example.com;

    # certbot --webroot 校验文件放这里，这样即使 80 全站跳转也能正常续期
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # 其余一律跳 HTTPS，用 301 而不是 302，避免搜索引擎记成临时跳转
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# 443 端口：真正的反代
# ---------------------------------------------------------------------------
server {
    # 这种写法兼容 nginx 1.22 / 1.24（Debian 12、Ubuntu 22.04/24.04 的默认版本都可用）。
    # 如果你的 nginx >= 1.25.1，可改成两行：listen 443 ssl; + http2 on;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name notes.example.com;

    # ---------- TLS ----------
    # certbot 默认路径（sudo certbot --nginx -d notes.example.com 会自动写入同样的两行）
    ssl_certificate     /etc/letsencrypt/live/notes.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/notes.example.com/privkey.pem;

    # 自签证书替代方案（内网/测试用），把上面两行换成：
    #   ssl_certificate     /etc/nginx/ssl/md-notes.crt;
    #   ssl_certificate_key /etc/nginx/ssl/md-notes.key;
    # 生成命令：
    #   sudo mkdir -p /etc/nginx/ssl
    #   sudo openssl req -x509 -nodes -days 3650 -newkey rsa:2048 \
    #     -keyout /etc/nginx/ssl/md-notes.key \
    #     -out /etc/nginx/ssl/md-notes.crt \
    #     -subj "/CN=notes.example.com"
    # 自签证书浏览器会告警，只适合内网。对外站点用 certbot：
    #   sudo apt install -y certbot python3-certbot-nginx
    #   sudo certbot --nginx -d notes.example.com
    #   sudo systemctl list-timers | grep certbot   # 确认自动续期定时器已生效

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 注意：应用层 helmet 在 NODE_ENV=production 时已经发送 HSTS。
    # nginx 这里不要再加 Strict-Transport-Security，否则会出现两个 HSTS 头。

    # ---------- 请求体大小 ----------
    # 导入文件夹：单文件 2MB、单次总计 20MB；附件上传：单文件 10MB，base64 后约 13.3MB。
    # 25m 给 base64 膨胀和 JSON 包装留足余量。超过时 nginx 直接返回 413（见 README 常见问题）。
    client_max_body_size 25m;

    # 大文件上传时不要过早超时
    client_body_timeout 60s;
    client_header_timeout 20s;

    # ---------- 压缩 ----------
    # 关闭 nginx 的 gzip：应用已经启用 compression 中间件。
    # 双重压缩既浪费 CPU，又可能因为对已压缩内容再压一次导致 Content-Length / 分块边界出错。
    # 同理不要在这个 server 上开 brotli 模块。
    gzip off;

    # ---------- 安全响应头 ----------
    # 三项兜底头，always 保证 4xx/5xx（含 nginx 自己产生的 413/502）也带上。
    # X-Frame-Options 与 CSP 的 frame-ancestors 双保险，防点击劫持。
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # 把上游 helmet 发的同名头摘掉，保证每个响应里只有一个 X-Frame-Options。
    # 下面两个带 proxy_hide_header 的 location 会重新写一遍这两行，
    # 因为 proxy_hide_header 在 location 里一旦出现就会替换整个继承列表。
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header X-Frame-Options;

    # ---------- 反代公共头 ----------
    # Host 必须原样传：应用用 req.get('host') 拼 sitemap / RSS 的绝对地址。
    # 注意 proxy_set_header 同样是不叠加的，location 里另写的会替换这里的整组，
    # 所以下面每个 location 都把需要的头重新写全。
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # 追加而不是覆盖，且应用 TRUST_PROXY=1 只信任最后一跳，客户端伪造的值会被丢弃
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;

    # 走 HTTP/1.1 才能正确转发并复用上游连接
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # 上游超时：应用 keepAliveTimeout 是 65s，这里 60s 略小于它，避免复用到已关闭的连接
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # 不在 nginx 层缓存动态页面：内容随时会变，缓存策略交给应用自己的 Cache-Control
    proxy_buffering on;
    proxy_buffers 16 16k;
    proxy_buffer_size 32k;

    # ---------- 带哈希的静态资源 ----------
    # vite 产物文件名带 content hash（/assets/index-abc123.js），内容永不变。
    # 这里用 expires 发一年缓存作为兜底，即使上游 Cache-Control 丢失也不会反复回源。
    # 本 location 不写 add_header，因此继续继承 server 级的三项安全头。
    location /assets/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # 这里写了 proxy_hide_header，所以要重复 server 级的三项，否则安全头会被上游重复发出
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Frame-Options;

        expires 1y;
        access_log off;
    }

    # ---------- 附件（上传的图片 / PDF） ----------
    # 文件名是随机 UUID，内容不会变，与 /assets/ 同样是长缓存。
    location /api/uploads/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Frame-Options;

        expires 1y;
    }

    # ---------- 健康检查 ----------
    # 只允许本机与运维网段访问，避免把 uptime 等内部信息暴露给公网。
    # 如果监控在另一台机器（如 uptime-kuma），把它的 IP 加一条 allow 再 reload。
    location = /api/healthz {
        allow 127.0.0.1;
        allow ::1;
        deny all;

        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    # ---------- RSS / sitemap / robots ----------
    # 内容随发布变化，缓存几分钟到几小时即可，避免发布后订阅器长时间看到旧内容
    location = /rss.xml {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 10m;
    }

    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1h;
    }

    location = /robots.txt {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1d;
    }

    # ---------- 默认：API 与 SPA ----------
    # 其余全部转发。SPA 路由（/p/1/n/2、/edit/...）由 Express 回退到 index.html，
    # 所以这里不能配 try_files，必须交给应用处理。
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
