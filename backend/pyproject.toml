[project]
name = "frameforge-backend"
version = "0.1.0"
description = "FrameForge AI Educational Video Generation Agent Platform Backend"
requires-python = ">=3.12"
dependencies = [
    "aiomysql>=0.3.2",
    "alembic>=1.20.1",
    "cryptography>=50.0.2",
    "deepagents>=0.7.38",
    "fastapi[standard]>=0.162.7",
    "greenlet>=3.5.6",
    "langchain>=1.5.0",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.8.0",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.22",
    "path>=17.1.1",
    "pwdlib[argon2]>=0.3.1",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "redis>=8.1.0",
    "sqlmodel>=0.0.50",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "FAST"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
